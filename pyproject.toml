[project]
name = "stand-pulse"
version = "0.1.0"
description = "CLI for Stand Pulse — MCP tools that probe a live AI stand and schedule digests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AIChallenge" }]
dependencies = [
  "mcp>=1.13,<2",
]

[project.scripts]
pulse = "stand_pulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stand_pulse"]
